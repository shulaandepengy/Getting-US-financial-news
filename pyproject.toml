[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getting-us-financial-news"
version = "0.2.0"
description = "Scheduled US financial news sampling, deduplication and DeepSeek subject/action judgement"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2", "jsonschema>=4.22,<5"]

[tool.setuptools]
packages = ["news_pipeline"]

[project.scripts]
us-news = "news_pipeline.cli:main"

